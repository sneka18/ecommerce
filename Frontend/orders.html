<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | NexCommerce AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="brand">
                <div class="brand-icon">✨</div>
                <span>Nex<span class="accent">Commerce</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Shop Catalog</a></li>
                <li><a href="/orders.html" class="nav-link active">My Orders</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/cart.html" id="navbar-cart-btn" class="cart-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="navbar-auth-actions" style="display: flex; gap: 8px;"></div>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 900px; padding: 40px 20px 80px;">
        <div style="margin-bottom: 30px;">
            <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;">My Orders History</h1>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Track recent purchases and view itemized delivery statuses.</p>
        </div>

        <div id="orders-list-container" style="display: flex; flex-direction: column; gap: 20px;"></div>

        <!-- Empty State -->
        <div id="orders-empty-state" style="display: none; text-align: center; padding: 60px 20px; background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--border);">
            <div style="font-size: 3.5rem; margin-bottom: 14px;">📦</div>
            <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 8px;">No orders found</h2>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">You haven't placed any orders yet.</p>
            <a href="/products.html" class="btn btn-primary">Start Shopping</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;
            await loadOrders();
        });

        async function loadOrders() {
            const container = document.getElementById('orders-list-container');
            const emptyState = document.getElementById('orders-empty-state');

            try {
                const orders = await API.get('/orders');
                if (!orders || orders.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="auth-card animate-fade-in" style="max-width: 100%; padding: 24px;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                            <div>
                                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Order Reference</span>
                                <div style="font-weight: 800; font-size: 1.15rem; color: var(--primary);">#ORD-${o.id.toString().padStart(5, '0')}</div>
                                <span style="font-size: 0.82rem; color: var(--text-secondary);">${new Date(o.created_at).toLocaleDateString()} at ${new Date(o.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <div style="text-align: right;">
                                <span class="status-badge ${o.status.toLowerCase()}" style="font-size: 0.85rem; padding: 6px 14px;">${o.status}</span>
                                <div style="font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin-top: 6px;">${formatCurrency(o.total_amount)}</div>
                            </div>
                        </div>

                        <!-- Items in this order -->
                        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
                            ${(o.items || []).map(item => `
                                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.92rem;">
                                    <div style="display: flex; align-items: center; gap: 12px;">
                                        <img src="${item.product ? item.product.image_url : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=100&q=80'}" style="width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border);">
                                        <div>
                                            <a href="/product-details.html?id=${item.product_id}" style="font-weight: 700; color: var(--text-primary);">${item.product ? item.product.name : 'Catalog Item'}</a>
                                            <div style="color: var(--text-muted); font-size: 0.8rem;">Qty: ${item.quantity} × ${formatCurrency(item.price)}</div>
                                        </div>
                                    </div>
                                    <strong style="color: var(--text-primary);">${formatCurrency(item.quantity * item.price)}</strong>
                                </div>
                            `).join('')}
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; font-size: 0.85rem; color: var(--text-secondary); flex-wrap: wrap; gap: 8px;">
                            <div>
                                📍 <strong>Delivery Address:</strong> ${o.shipping_address}
                            </div>
                            <div style="font-weight: 600;">
                                💳 ${o.payment_method} (${o.payment_status})
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                showToast(err.message || 'Error loading orders.', 'error');
            }
        }
    </script>
</body>
</html>
