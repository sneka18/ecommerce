<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | NexCommerce AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="brand">
                <div class="brand-icon">✨</div>
                <span>Nex<span class="accent">Commerce</span></span>
            </a>
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/products.html" class="nav-link">Shop Catalog</a></li>
                <li><a href="/orders.html" class="nav-link">My Orders</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/cart.html" id="navbar-cart-btn" class="cart-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count-badge" class="cart-badge" style="display: none;">0</span>
                </a>
                <div id="navbar-auth-actions" style="display: flex; gap: 8px;"></div>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 680px; padding: 40px 20px 80px;">
        <div class="auth-card animate-fade-in" style="max-width: 100%; padding: 36px;">
            <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 28px;">
                <div style="width: 64px; height: 64px; background: var(--ai-gradient); color: #fff; font-size: 1.8rem; font-weight: 800; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    👤
                </div>
                <div>
                    <h1 id="profile-display-name" style="font-size: 1.6rem; font-weight: 800;">User Account</h1>
                    <span id="profile-display-role" class="status-badge active" style="text-transform: uppercase;">CUSTOMER</span>
                </div>
            </div>

            <form id="profile-form">
                <div class="form-group">
                    <label class="form-label" for="profile-email">Email Address (Read-only)</label>
                    <input type="email" id="profile-email" class="form-input" disabled style="background: #f1f5f9; cursor: not-allowed;">
                </div>

                <div class="form-group">
                    <label class="form-label" for="profile-name">Full Name</label>
                    <input type="text" id="profile-name" class="form-input" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profile-phone">Phone Number</label>
                    <input type="tel" id="profile-phone" class="form-input" placeholder="+1 (555) 000-0000">
                </div>

                <div class="form-group">
                    <label class="form-label" for="profile-password">New Password (Leave blank to keep unchanged)</label>
                    <input type="password" id="profile-password" class="form-input" placeholder="••••••••">
                </div>

                <button type="submit" id="save-profile-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">
                    Update Profile Details
                </button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;

            try {
                const user = await API.get('/auth/me');
                document.getElementById('profile-display-name').innerText = user.full_name;
                document.getElementById('profile-display-role').innerText = user.role;
                document.getElementById('profile-email').value = user.email;
                document.getElementById('profile-name').value = user.full_name;
                document.getElementById('profile-phone').value = user.phone || '';
            } catch (err) {
                showToast(err.message || 'Error loading profile.', 'error');
            }
        });

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-profile-btn');
            btn.disabled = true;

            const payload = {
                full_name: document.getElementById('profile-name').value.trim(),
                phone: document.getElementById('profile-phone').value.trim() || null
            };
            const pwd = document.getElementById('profile-password').value;
            if (pwd) payload.password = pwd;

            try {
                const updated = await API.put('/auth/profile', payload);
                const token = API.getToken();
                API.setAuth(token, updated);
                showToast('Profile updated successfully!', 'success');
                document.getElementById('profile-display-name').innerText = updated.full_name;
                document.getElementById('profile-password').value = '';
                btn.disabled = false;
                updateNavbarAuth();
            } catch (err) {
                showToast(err.message || 'Failed to update profile.', 'error');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
