<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management | NexCommerce Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon" style="background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);">⚙️</div>
                <div class="sidebar-brand">Admin Console</div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="/admin/dashboard.html">📊 Analytics Overview</a>
                </li>
                <li class="sidebar-item active">
                    <a href="/admin/customers.html">👥 Customer Accounts</a>
                </li>
                <li class="sidebar-item">
                    <a href="/admin/sellers.html">🏪 Seller Merchants</a>
                </li>
                <li class="sidebar-item">
                    <a href="/admin/products.html">📦 Product Catalog</a>
                </li>
                <li class="sidebar-item">
                    <a href="/admin/orders.html">🛍️ Platform Orders</a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <a href="/admin/dashboard.html" class="btn btn-outline btn-sm" style="color: #94a3b8; border-color: #334155;">← Back to Overview</a>
                <button onclick="handleLogout()" class="btn btn-outline btn-sm" style="color: #ef4444; border-color: #7f1d1d;">Logout</button>
            </div>
        </aside>

        <div class="dashboard-main">
            <header class="dashboard-topbar">
                <h2 style="font-size: 1.25rem; font-weight: 800;">Customer Management</h2>
                <a href="/admin/dashboard.html" class="btn btn-outline btn-sm">Overview</a>
            </header>

            <div class="dashboard-content">
                <div class="table-card">
                    <div class="table-header">
                        <h3 class="table-title">Registered Customers</h3>
                    </div>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Customer ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Registered On</th>
                                <th>Account Status</th>
                                <th style="text-align: right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="customers-table-body">
                            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Loading customers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth(['admin'])) return;
            await loadCustomers();
        });

        async function loadCustomers() {
            const tbody = document.getElementById('customers-table-body');
            try {
                const users = await API.get('/admin/users', { role: 'customer' });
                if (!users || users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No customer accounts registered.</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td style="font-weight: 700; color: var(--primary);">#USR-${u.id}</td>
                        <td style="font-weight: 600;">${u.full_name}</td>
                        <td style="color: var(--text-secondary);">${u.email}</td>
                        <td>${u.phone || 'N/A'}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem;">${new Date(u.created_at).toLocaleDateString()}</td>
                        <td><span class="status-badge ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'Active' : 'Deactivated'}</span></td>
                        <td style="text-align: right;">
                            <button onclick="toggleUser(${u.id})" class="btn btn-outline btn-sm" style="${u.is_active ? 'color: #ef4444; border-color: #fca5a5;' : 'color: #059669; border-color: #6ee7b7;'}">
                                ${u.is_active ? 'Deactivate' : 'Activate'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #ef4444;">Error loading customers.</td></tr>`;
            }
        }

        async function toggleUser(userId) {
            try {
                const res = await API.put(`/admin/users/${userId}/status`);
                showToast(res.message, 'info');
                await loadCustomers();
            } catch (err) {
                showToast(err.message || 'Error updating status.', 'error');
            }
        }
    </script>
</body>
</html>
